name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Required so the workflow can request an OIDC token for Workload Identity
# Federation (no long-lived SA keys in GitHub secrets).
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: auto-trader-493814
  GCP_ZONE: europe-west3-a
  VM_NAME: ibkr-gateway
  WIF_PROVIDER: projects/1023470996532/locations/global/workloadIdentityPools/github-actions/providers/github
  DEPLOYER_SA: ibkr-gateway-deployer@auto-trader-493814.iam.gserviceaccount.com

jobs:
  deploy:
    name: deploy to ${{ vars.VM_NAME || 'ibkr-gateway' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret scan
        run: bash scripts/scan-secrets.sh

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps (for typecheck)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The smoke tests need GCP creds + Firebase env vars. They run
      # AFTER the WIF auth step below, so this step is just typecheck/
      # scan for now; the real test gate runs on the VM after deploy.

      - name: Assert Firebase vars are configured
        run: |
          missing=0
          for k in FIREBASE_API_KEY FIREBASE_AUTH_DOMAIN FIREBASE_PROJECT_ID FIREBASE_STORAGE_BUCKET FIREBASE_MESSAGING_SENDER_ID FIREBASE_APP_ID; do
            v="${!k:-}"
            if [[ -z "$v" ]]; then
              echo "::error::Missing GitHub repo Secret: $k"
              echo "  Set in: Settings → Secrets and variables → Actions → Secrets tab"
              missing=1
            fi
          done
          if [[ $missing -eq 1 ]]; then exit 1; fi
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

      - name: Build deploy tarball
        run: |
          tar --exclude='./node_modules' \
              --exclude='./.git' \
              --exclude='./dist' \
              --exclude='./.github' \
              --exclude='*.log' \
              -czf /tmp/ibkr-gateway.tar.gz .
          ls -lh /tmp/ibkr-gateway.tar.gz

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Copy tarball to VM (via IAP tunnel)
        run: |
          gcloud compute scp /tmp/ibkr-gateway.tar.gz \
            "${VM_NAME}:/tmp/ibkr-gateway.tar.gz" \
            --zone="$GCP_ZONE" \
            --tunnel-through-iap \
            --quiet

      - name: Run deploy script on VM
        env:
          # Firebase web config — public but kept out of source code so
          # GitHub's secret scanner doesn't flag the repo. Configure as
          # GitHub repo Variables (Settings → Secrets and variables →
          # Actions → Variables tab).
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          gcloud compute ssh "$VM_NAME" \
            --zone="$GCP_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command="bash -s" <<REMOTE_EOF
          set -euo pipefail
          tmpdir=\$(mktemp -d)
          tar -xzf /tmp/ibkr-gateway.tar.gz -C "\$tmpdir" ./deploy/deploy-on-vm.sh
          chmod +x "\$tmpdir/deploy/deploy-on-vm.sh"
          export GCP_PROJECT_ID=auto-trader-493814
          export FIREBASE_API_KEY='${FIREBASE_API_KEY}'
          export FIREBASE_AUTH_DOMAIN='${FIREBASE_AUTH_DOMAIN}'
          export FIREBASE_PROJECT_ID='${FIREBASE_PROJECT_ID}'
          export FIREBASE_STORAGE_BUCKET='${FIREBASE_STORAGE_BUCKET}'
          export FIREBASE_MESSAGING_SENDER_ID='${FIREBASE_MESSAGING_SENDER_ID}'
          export FIREBASE_APP_ID='${FIREBASE_APP_ID}'
          "\$tmpdir/deploy/deploy-on-vm.sh"
          rm -rf "\$tmpdir"
          REMOTE_EOF

      - name: Public health check
        run: |
          for i in 1 2 3 4 5; do
            body=$(curl -fsS -m 10 "https://ibkr-gateway.bogdanripa.com/healthz" || echo "FAIL")
            echo "attempt $i: $body"
            if [[ "$body" == *"ok"* ]]; then exit 0; fi
            sleep 3
          done
          echo "public healthcheck FAILED" >&2
          exit 1
